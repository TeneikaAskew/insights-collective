[functions.admin-users]
# Every action is admin-gated inside the function (getUser + has_admin_access).
# Note verify_jwt alone is NOT the gate: it accepts the public anon key, which
# is how the removed E2E bootstrap branch was reachable by anyone.
verify_jwt = true

[functions.together-ai]
verify_jwt = true

[functions.assistant-ai]
verify_jwt = true

[functions.auth-callback]
verify_jwt = false

[functions.resume-analyzer]
verify_jwt = true

[functions.analyze-job-match]
# Was deployed with verify_jwt = false — an unauthenticated LLM endpoint.
# requireUser() inside the function is the real gate; this stops unauthenticated
# requests from even reaching it.
verify_jwt = true

[functions.scrape-job-description]
# Server-side fetcher that returns the response body. Gated by requireUser()
# plus scheme/private-range validation inside the function.
verify_jwt = true

[functions.generate-study-guide]
verify_jwt = true

[functions.evaluate-star-response]
verify_jwt = true

[functions.course-calendar-feed]
# Stays false on purpose: a calendar client subscribing to an ICS URL cannot
# send an Authorization header. The gate is the per-enrollment feed token in
# the query string, resolved via resolve_calendar_feed_token().
verify_jwt = false

[functions.verify-certificate]
verify_jwt = false

[functions.generate-course-outline]
verify_jwt = true



[functions.generate-lesson-content]
verify_jwt = true

[functions.generate-section-summary]
verify_jwt = true

[functions.evaluateCareerAdvice]
verify_jwt = true

[functions.generate-career-action-plan]
verify_jwt = true

[functions.messages-helper]
# Was deployed with verify_jwt = false. The function authenticates the caller
# itself and now derives the acting user from the JWT rather than the body.
verify_jwt = true

[functions.generate-message]
verify_jwt = true

[functions.create-zoom-meeting]
# Was deployed with verify_jwt = false: anyone could create meetings on the
# org's Zoom account. requireStaff() inside.
verify_jwt = true

[functions.get-zoom-recordings]
# Was deployed with verify_jwt = false and returns account-wide recording
# download_urls. requireAdmin() inside.
verify_jwt = true

[functions.twitter-scraper]
verify_jwt = true

[functions.scrape-teneika-tweets]
verify_jwt = true

[functions.scrape-linkedin-posts]
verify_jwt = true

[functions.notify-course-announcement]
verify_jwt = true

[functions.portfolio-ideas]
verify_jwt = true

[functions.execute-code]
verify_jwt = true

[functions.review-code]
verify_jwt = true

[functions.get-debug-token]
verify_jwt = true

[functions.score-quiz]
# Grades a submission server-side. Authenticates the caller itself and refuses
# submissions that are not theirs.
verify_jwt = true

[functions.bls-wages]
# Stays false so the public wage bands stay readable signed out — the landing
# page renders them before anyone logs in. The write paths gate themselves:
# lookup calls requireUser(), refresh compares the presented bearer token
# against the service-role key.
verify_jwt = false
