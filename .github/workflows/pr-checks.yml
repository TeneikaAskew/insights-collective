name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also run on direct pushes to main. These checks were pull_request-only, so
  # anything landing on main without a PR skipped every one of them — which is
  # how `if (await ready.count())` reached main in ce0c511e and sat there
  # unnoticed until the next PR inherited the red. Commits arrive here directly
  # (Lovable pushes as gpt-engineer-app[bot]), so PR-only coverage leaves the
  # default branch unguarded by exactly the checks meant to protect it.
  push:
    branches: [main]

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v40
      with:
        files: |
          src/**/*.ts
          src/**/*.tsx
    
    - name: Run linter on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: npm run lint
    
    - name: Run tests
      run: npm run test -- --run
    
    - name: Generate coverage
      run: npm run test:coverage -- --run
    
    - name: Comment PR with coverage
      uses: davelosert/vitest-coverage-report-action@v2
      if: always()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        json-summary-path: ./coverage/coverage-summary.json
    
    - name: Check for breaking changes
      run: |
        echo "Checking for potential breaking changes..."
        git diff origin/${{ github.base_ref }} --name-only | grep -E "src/integrations|src/services" || echo "No critical files changed"
    
    - name: Build verification
      run: npm run build
    
