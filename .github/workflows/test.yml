name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Run linter
      run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Run unit tests
      run: npm run test -- --run
    
    - name: Generate coverage report
      if: matrix.node-version == '20.x'
      run: npm run test:coverage -- --run
    
    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Check coverage threshold
      if: matrix.node-version == '20.x'
      run: |
        # Ratchet baseline: whole-app line coverage, measured not guessed.
        # 16.62% when CI was repaired (2026-07, vitest 4 — which honestly
        # counts every src file, imported or not); 39.32% measured 2026-08-11
        # across 152 files. The floor moves with it, which is the whole point
        # of a ratchet: it can only be lowered deliberately, in a diff someone
        # has to justify.
        #
        # Set to 38, not 39.32 — about a point of headroom so a run that
        # happens to skip a well-covered spec does not fail a PR that changed
        # nothing. Raise it again the next time coverage climbs.
        COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
        if (( $(echo "$COVERAGE < 38" | bc -l) )); then
          echo "Coverage $COVERAGE% is below the 38% ratchet baseline"
          exit 1
        fi
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.node-version }}
        path: coverage/

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Build project
      run: npm run build
    
    - name: Check build size
      run: |
        SIZE=$(du -sh dist | cut -f1)
        echo "Build size: $SIZE"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7