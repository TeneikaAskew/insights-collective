# Apply one migration to the live database, by hand, from a runner.
#
# Why a workflow and not a laptop: the near-miss in
# docs/lessons-learned/03-database-and-migrations.md was a migration whose
# version number was already recorded, so Supabase silently skipped it while
# every local signal said it had shipped. That check is mechanical and belongs
# somewhere it always runs. This also leaves a log of who applied what and when,
# which `psql` from a terminal does not.
#
# Deliberately manual, one file at a time, and never on push. A blanket
# `supabase db push` would apply whatever the repo happens to contain against
# whatever the database happens to be, and the repo describes intent while only
# the live system describes state.

name: Apply a database migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Filename in supabase/migrations/, ALL to apply every pending migration, RECONCILE to also record files whose objects already exist, or RECORD:<version> to record a version RECONCILE set aside (requires scripts/reconcile/<version>*.sql to prove its effects are present)'
        required: true
        type: string
      confirm:
        description: 'Type "apply" to confirm this runs against the live database'
        required: true
        type: string
      verify_table:
        description: 'Optional: a table whose constraints and indexes to print afterwards, so the effect is shown rather than assumed'
        required: false
        type: string

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "::error::Confirmation not given. Re-run and type \"apply\" in the confirm field."
            exit 1
          fi

      - name: Resolve the migration file
        id: resolve
        if: inputs.migration != 'ALL' && inputs.migration != 'RECONCILE' && !startsWith(inputs.migration, 'RECORD:')
        run: |
          NAME='${{ inputs.migration }}'
          # No paths. The input names a file in the migrations directory and
          # nothing else, so it cannot reach a scratch .sql somebody left around.
          case "$NAME" in
            */*|..*|"") echo "::error::migration must be a bare filename in supabase/migrations/"; exit 1 ;;
          esac
          FILE="supabase/migrations/$NAME"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist on this ref"
            exit 1
          fi
          # Supabase records the leading timestamp, not the whole filename, and
          # the separator is not always an underscore: 53 of these files are the
          # legacy Lovable form, 20250614185655-10e59561-db23-....sql. Cutting
          # at the first underscore returns the whole filename for those, which
          # then matches no recorded version — so the duplicate check would pass
          # on an already-applied migration, re-run it, and record a version
          # `supabase db push` does not recognise. Take the leading digits, which
          # is what scripts/reconcile_migration_ledger.sql recorded them under.
          # Length is not fixed either: most are a 14-digit timestamp, but
          # 20251006_video_analytics_and_discussions is recorded as the 8-digit
          # '20251006'. The rule is the leading digits, whatever there are of
          # them, with a date's worth as the floor. The sed leaves only digits,
          # so the pattern below is "8 or more of them".
          VERSION="$(printf '%s' "$NAME" | sed 's/[^0-9].*//')"
          case "$VERSION" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) : ;;
            *) echo "::error::$NAME does not start with a version of at least 8 digits"; exit 1 ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Applying $FILE (version $VERSION)"

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Check the connection and report what is pending
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::The SUPABASE_DB_URL secret is not set on this repository, so there is nothing to connect to."
            exit 1
          fi
          psql "$PGURL" -v ON_ERROR_STOP=1 -Atc 'select 1' > /dev/null
          echo "Connected."

          # Two files sharing one version is the near-miss in
          # docs/lessons-learned/03: Supabase tracks by version, so whichever
          # ran second was silently skipped — no error, no warning.
          #
          # Reported here, but NOT fatal on its own. 20260728000000 is carried
          # by two files and is already recorded, so neither is pending and
          # nothing is about to go wrong; refusing every run over a settled
          # historical wart would just make this tool unusable. The refusal
          # that matters is scoped to versions actually about to be applied —
          # see the batch step.
          DUPES=$(ls -1 supabase/migrations/*.sql | xargs -n1 basename \
            | sed 's/[^0-9].*//' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::warning::These versions are carried by more than one file:"
            for v in $DUPES; do
              ls -1 supabase/migrations/"$v"*.sql | sed 's/^/  /'
            done
          fi

          # "It's in the repo" is not "it ran". List the gap before touching it.
          psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
            'select version from supabase_migrations.schema_migrations' | sort > /tmp/applied.txt
          # Same derivation as above, for the same reason: cutting at the
          # underscore leaves the legacy hyphen names intact, and every one of
          # them would then be listed as pending on a ledger that already has
          # it — dozens of false entries for an operator to pick from.
          ls -1 supabase/migrations/*.sql | xargs -n1 basename \
            | sed 's/[^0-9].*//' | sort -u > /tmp/repo.txt
          echo "### Migrations in the repo but not recorded in the database" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          comm -23 /tmp/repo.txt /tmp/applied.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse if this version was already recorded
        if: inputs.migration != 'ALL' && inputs.migration != 'RECONCILE' && !startsWith(inputs.migration, 'RECORD:')
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # The near-miss: Supabase tracks by version, and a duplicate version is
          # silently skipped. Better to stop here than to report a success that
          # did nothing.
          COUNT=$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$VERSION'")
          if [ "$COUNT" != "0" ]; then
            echo "::error::Version $VERSION is already recorded. Renumber the migration rather than forcing it through."
            exit 1
          fi

      - name: Apply it
        if: inputs.migration != 'ALL' && inputs.migration != 'RECONCILE' && !startsWith(inputs.migration, 'RECORD:')
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          FILE: ${{ steps.resolve.outputs.file }}
          VERSION: ${{ steps.resolve.outputs.version }}
          NAME: ${{ inputs.migration }}
        run: |
          # One transaction covering both the file and the ledger entry.
          # psql runs -f and -c in the order given and --single-transaction
          # wraps the lot, so the schema change and the record of it commit
          # together. Two invocations would leave a window where the schema is
          # changed and the ledger still says pending — a later `db push` would
          # then run the file a second time, which is fine for `add constraint`
          # and not fine for anything that moves data.
          #
          # ON_ERROR_STOP because psql's default is to carry on after an error
          # and exit 0. Only `version` on the insert — that is the column
          # Supabase matches on, and the one every version of the table has.
          psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction \
            -f "$FILE" \
            -c "insert into supabase_migrations.schema_migrations (version) values ('$VERSION')"
          echo "Applied and recorded $VERSION ($NAME)."

      - name: Apply every pending migration, oldest first
        if: inputs.migration == 'ALL'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Batch mode exists because the gap between repo and ledger grows in
          # bursts — 24 at the last count — and dispatching that many runs by
          # hand is where someone starts skipping the checks.
          #
          # Same guarantees as the single-file path, per file: one transaction
          # covering both the schema change and its ledger row, ON_ERROR_STOP,
          # and the version read off the leading digits the way the ledger
          # records it. Order is oldest first, because a later migration may
          # depend on an earlier one.
          #
          # `set -e` plus ON_ERROR_STOP means the first failure ends the run.
          # That is deliberate: everything before it is committed and recorded,
          # everything after is untouched, and the log says exactly where it
          # stopped. Carrying on past a failure would apply migrations whose
          # precondition just failed to exist.
          set -e

          comm -23 \
            <(ls -1 supabase/migrations/*.sql | xargs -n1 basename | sed 's/[^0-9].*//' | sort -u) \
            <(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
                'select version from supabase_migrations.schema_migrations' | sort) \
            > /tmp/pending.txt

          # The refusal that matters. If a PENDING version is carried by more
          # than one file, `sort -u` has already collapsed them into a single
          # entry: the loop below would apply whichever file sorts first,
          # record the shared version, and the closing gap check would then
          # report zero while the other file had never run — a silent skip
          # dressed up as a clean sweep, which is the whole failure this repo
          # has hit before.
          #
          # Refuse rather than guess. Choosing a file means choosing which
          # migration to lose, and renumbering is a decision about recorded
          # history that belongs to a person.
          PENDING_DUPES=""
          while read -r V; do
            [ -z "$V" ] && continue
            N=$(ls -1 supabase/migrations/"$V"*.sql 2>/dev/null | wc -l)
            [ "$N" -gt 1 ] && PENDING_DUPES="$PENDING_DUPES $V"
          done < /tmp/pending.txt
          if [ -n "$PENDING_DUPES" ]; then
            echo "::error::A pending version is carried by more than one file. Renumber before applying."
            for v in $PENDING_DUPES; do
              ls -1 supabase/migrations/"$v"*.sql | sed 's/^/  /'
            done
            exit 1
          fi

          COUNT=$(wc -l < /tmp/pending.txt)
          echo "### Applying $COUNT pending migration(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing pending." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while read -r VERSION; do
            [ -z "$VERSION" ] && continue
            FILE=$(ls -1 supabase/migrations/"$VERSION"*.sql | head -1)
            if [ ! -f "$FILE" ]; then
              echo "::error::no file found for pending version $VERSION"
              exit 1
            fi
            echo "applying $VERSION  $(basename "$FILE")" | tee -a "$GITHUB_STEP_SUMMARY"
            psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction \
              -f "$FILE" \
              -c "insert into supabase_migrations.schema_migrations (version) values ('$VERSION')"
          done < /tmp/pending.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Prove the gap actually closed, rather than trusting the loop.
          REMAINING=$(comm -23 \
            <(ls -1 supabase/migrations/*.sql | xargs -n1 basename | sed 's/[^0-9].*//' | sort -u) \
            <(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
                'select version from supabase_migrations.schema_migrations' | sort) | wc -l)
          echo "Pending after this run: $REMAINING" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$REMAINING" -eq 0 ]

      - name: Reconcile — apply what is missing, record what is already there
        if: inputs.migration == 'RECONCILE'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Most of this backlog is not unapplied. It is UNRECORDED.
          #
          # `ALL` proved it: 20260731000000_tighten_blog_posts_rls stopped the
          # batch with `policy "Authors admins instructors can view posts"
          # already exists`. The objects are in the database; only the ledger
          # is behind. scripts/reconcile_migration_ledger.sql exists because
          # this already happened once, to 78 files applied outside the ledger.
          #
          # So run each file WITHOUT --single-transaction and WITHOUT
          # ON_ERROR_STOP, so every statement is attempted independently:
          # anything genuinely missing is created, and anything already present
          # raises "already exists" and is skipped. Either way the end state is
          # what the file describes, which is the thing that matters.
          #
          # That tolerance is the whole risk, so it is narrow and audited:
          # ONLY "already exists" is forgiven. Every other error stops the run
          # with the file named. In particular "does not exist" is NOT
          # tolerated — an ALTER against a missing table means the file's
          # preconditions are absent and recording it would be a lie.
          #
          # Safe against double-writes because that was checked before ALL ran:
          # of the pending set, three write only inside CREATE FUNCTION bodies,
          # two use ON CONFLICT, one DELETEs a named row, and one sets columns
          # to constants. None duplicates anything on a second pass.
          set -e

          comm -23 \
            <(ls -1 supabase/migrations/*.sql | xargs -n1 basename | sed 's/[^0-9].*//' | sort -u) \
            <(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
                'select version from supabase_migrations.schema_migrations' | sort) \
            > /tmp/pending.txt

          COUNT=$(wc -l < /tmp/pending.txt)
          echo "### Reconciling $COUNT pending migration(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -eq 0 ] && { echo "Nothing pending."; exit 0; }

          # Same refusal as the batch: a pending version carried by two files
          # would silently lose one of them.
          while read -r V; do
            [ -z "$V" ] && continue
            [ "$(ls -1 supabase/migrations/"$V"*.sql 2>/dev/null | wc -l)" -gt 1 ] && {
              echo "::error::Pending version $V is carried by more than one file. Renumber first."
              exit 1
            }
          done < /tmp/pending.txt

          # A file that opens its own transaction cannot be reconciled this
          # way, and pretending otherwise is the dangerous case.
          #
          # 20260801000300_profiles_foreign_keys.sql starts with BEGIN;. The
          # first "already exists" aborts that transaction, so every later
          # statement returns "current transaction is aborted" WITHOUT RUNNING.
          # Error-tolerant mode therefore does not attempt every statement — it
          # attempts one and abandons the rest. Recording the version would
          # assert an end state nobody established.
          #
          # Tolerating "current transaction is aborted" would be worse: it
          # would forgive the cascade from a genuine failure too, which is the
          # one error this mode must never swallow.
          #
          # So these are set aside for a person, named, and the run fails at
          # the end rather than reporting a clean sweep.
          : > /tmp/manual.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while read -r VERSION; do
            [ -z "$VERSION" ] && continue
            FILE=$(ls -1 supabase/migrations/"$VERSION"*.sql | head -1)
            if grep -qiE '^[[:space:]]*BEGIN[[:space:]]*;' "$FILE"; then
              echo "SKIPPED  $VERSION  $(basename "$FILE")  (opens its own transaction — needs manual reconciliation)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$VERSION $(basename "$FILE")" >> /tmp/manual.txt
              continue
            fi
            # Capture psql's own exit status rather than discarding it. Without
            # ON_ERROR_STOP, a SQL error does NOT make psql exit nonzero — it
            # reports the error and carries on, which is the behaviour this mode
            # is built on. So a nonzero status here is never a tolerated SQL
            # error; it is a client-level failure: 1 for psql's own fatal error,
            # 2 for a connection that could not be made or was lost mid-file,
            # 3 only with ON_ERROR_STOP.
            #
            # `|| true` used to swallow that. A connection dropped part-way
            # through a file prints "connection to server was lost" rather than
            # a line matching '^psql:.*ERROR:', so the grep below found nothing,
            # UNTOLERATED was empty, the skipped count was zero, and the file was
            # reported "applied" and its version INSERTed — having run only as
            # far as the drop. A false ledger entry is the one outcome this
            # whole workflow exists to prevent.
            set +e
            psql "$PGURL" -f "$FILE" > /tmp/out.txt 2>&1
            PSQL_STATUS=$?
            set -e
            if [ "$PSQL_STATUS" -ne 0 ]; then
              echo "::error::psql exited $PSQL_STATUS on $(basename "$FILE") — a client-level failure, not a tolerated SQL error. Nothing recorded for it."
              cat /tmp/out.txt
              exit 1
            fi

            # Every error the file produced, not just the first.
            grep -E '^psql:.*ERROR:' /tmp/out.txt > /tmp/errs.txt || true
            UNTOLERATED=$(grep -vE 'already exists' /tmp/errs.txt || true)
            if [ -n "$UNTOLERATED" ]; then
              echo "::error::$(basename "$FILE") failed with something other than \"already exists\"; nothing recorded for it."
              echo "$UNTOLERATED"
              exit 1
            fi

            SKIPPED=$(wc -l < /tmp/errs.txt)
            if [ "$SKIPPED" -eq 0 ]; then
              echo "applied  $VERSION  $(basename "$FILE")" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "recorded $VERSION  $(basename "$FILE")  ($SKIPPED statement(s) already present)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              sed 's/^/           /' /tmp/errs.txt
            fi

            psql "$PGURL" -v ON_ERROR_STOP=1 -c \
              "insert into supabase_migrations.schema_migrations (version) values ('$VERSION')"
          done < /tmp/pending.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          REMAINING=$(comm -23 \
            <(ls -1 supabase/migrations/*.sql | xargs -n1 basename | sed 's/[^0-9].*//' | sort -u) \
            <(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
                'select version from supabase_migrations.schema_migrations' | sort) | wc -l)
          echo "Pending after this run: $REMAINING" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/manual.txt ]; then
            echo "::error::These open their own transaction and were not reconciled. Each needs a person to confirm its effects are present, then a manual ledger insert:"
            sed 's/^/  /' /tmp/manual.txt
            exit 1
          fi
          [ "$REMAINING" -eq 0 ]

      # RECORD:<version> is the other half of RECONCILE's handoff.
      #
      # RECONCILE sets aside any file that opens its own transaction and fails
      # naming it, because error-tolerant mode cannot reconcile such a file: the
      # first "already exists" aborts the transaction and every later statement
      # returns "current transaction is aborted" WITHOUT RUNNING. Recording the
      # version off the back of that would assert an end state nobody
      # established.
      #
      # This mode records such a version, but ONLY behind a companion script in
      # scripts/reconcile/ that asserts the migration's effects are actually
      # present. The mechanism is general; the evidence is hand-written per file,
      # because only a person can say what "its effects are present" means for a
      # given migration. No script, no record — the refusal below is the point of
      # the whole mode, not a guard rail on it.
      #
      # The script owns the ledger INSERT itself, so its assertions and the
      # record commit in one transaction and cannot disagree. That is why this
      # step does not append an insert of its own the way "Apply it" does.
      - name: Record a version whose effects a script can prove are present
        if: startsWith(inputs.migration, 'RECORD:')
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          VERSION="${{ inputs.migration }}"
          VERSION="${VERSION#RECORD:}"

          # Same rule as the migration input: a version, not a path, so this
          # cannot be pointed at a scratch .sql somebody left around.
          case "$VERSION" in
            */*|..*|"") echo "::error::RECORD: must be followed by a bare version, e.g. RECORD:20260801000300"; exit 1 ;;
          esac
          case "$VERSION" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) : ;;
            *) echo "::error::'$VERSION' is not a version of at least 8 digits"; exit 1 ;;
          esac

          COUNT=$(ls -1 scripts/reconcile/"$VERSION"*.sql 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No scripts/reconcile/$VERSION*.sql. This mode records a version only when a script can prove the migration's effects are present; write that script first."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::More than one scripts/reconcile/$VERSION*.sql. Exactly one, so it is unambiguous which evidence was used."
            exit 1
          fi
          SCRIPT=$(ls -1 scripts/reconcile/"$VERSION"*.sql | head -1)

          ALREADY=$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$VERSION'")
          if [ "$ALREADY" != "0" ]; then
            echo "Version $VERSION is already recorded. Nothing to do."
            echo "Version $VERSION was already recorded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Running $SCRIPT against the live database."
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # --single-transaction so a failed assertion rolls back the script's
          # own INSERT with it. ON_ERROR_STOP because psql otherwise carries on
          # past an error and exits 0, which is how a failed check would read as
          # a pass.
          psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -f "$SCRIPT" 2>&1 | tee /tmp/record.txt
          STATUS=${PIPESTATUS[0]}
          sed 's/^/  /' /tmp/record.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" -eq 0 ] || exit "$STATUS"

          # Read it back rather than trusting the exit code.
          CONFIRMED=$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$VERSION'")
          if [ "$CONFIRMED" != "1" ]; then
            echo "::error::$SCRIPT exited 0 but $VERSION is still not recorded."
            exit 1
          fi
          echo "Recorded $VERSION on the evidence of $SCRIPT." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show the effect
        if: inputs.verify_table != ''
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          TABLE: ${{ inputs.verify_table }}
        run: |
          # Verify the effect, not the success flag: psql exiting 0 says the
          # statements ran, not that the schema now looks the way the migration
          # describes.
          case "$TABLE" in
            *[!a-zA-Z0-9_]*) echo "::error::verify_table must be a bare table name"; exit 1 ;;
          esac
          {
            echo "### Constraints and indexes now on public.$TABLE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c \
            "select conname as name, pg_get_constraintdef(oid) as definition
               from pg_constraint where conrelid = 'public.$TABLE'::regclass
              order by conname" \
            -c "select indexname as name, indexdef as definition
                  from pg_indexes where schemaname = 'public' and tablename = '$TABLE'
                 order by indexname" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
