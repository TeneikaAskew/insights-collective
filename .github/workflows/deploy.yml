name: Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.yourapp.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Run tests
      run: npm run test -- --run
    
    - name: Build application
      run: npm run build
      env:
        NODE_ENV: staging
    
    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Example: npx wrangler pages deploy dist --project-name=your-project-staging
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://yourapp.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Run full test suite
      run: npm run test:coverage -- --run
    
    - name: Verify coverage threshold
      run: |
        COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "::error::Coverage $COVERAGE% is below 80% - blocking production deployment"
          exit 1
        fi
    
    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
    
    - name: Create deployment artifact
      run: |
        tar -czf deployment.tar.gz dist/
    
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: npx wrangler pages deploy dist --project-name=your-project-production
    
    - name: Health check
      run: |
        echo "Running production health checks..."
        # Add health check commands here
    
    - name: Notify on success
      if: success()
      run: |
        echo "Production deployment successful!" >> $GITHUB_STEP_SUMMARY
    
    - name: Rollback on failure
      if: failure()
      run: |
        echo "::error::Production deployment failed - initiating rollback"
        # Add rollback commands here

  preview-deployment:
    name: Deploy Preview for PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Build application
      run: npm run build
    
    - name: Deploy preview
      run: |
        echo "Deploying preview for PR #${{ github.event.pull_request.number }}"
        # Add preview deployment commands here
    
    - name: Comment PR with preview URL
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '🚀 Preview deployment ready at: https://preview-${{ github.event.pull_request.number }}.yourapp.com'
          })
