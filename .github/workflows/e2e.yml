name: E2E Playwright Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Replays every query the code issues against the live database and fails if
  # any of them is invalid on a page a user can actually load.
  #
  # Five column mismatches and six broken embeds reached production and survived
  # 893 unit tests and 99 e2e specs, because a rejected query renders as an empty
  # list rather than an error: unit tests mock Supabase away, and the e2e console
  # fixture suppressed all of /rest/v1/. Only the database can answer whether a
  # query shape is valid.
  #
  # Separate job from the Playwright suite: it needs no browser and no preview
  # server, finishes in a couple of minutes, and a PR that breaks a query should
  # say so quickly rather than after a 30-minute e2e run.
  query-validity:
    name: Query validity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'e2e-admin@insightscollective.org' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || 'e2e-instructor@insightscollective.org' }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL || 'e2e-member@insightscollective.org' }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://siuqvhscuiycvdrtiqsh.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'siuqvhscuiycvdrtiqsh' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # No Supabase management token anywhere in this job. The catalogue reads go
      # through public.audit_db_functions / audit_db_columns and the invariants
      # through public.audit_invariants(), all admin-gated over PostgREST — see
      # supabase/migrations/20260801000000_audit_surfaces.sql for why that is
      # sufficient. A management token can run arbitrary SQL project-wide, which
      # is far more authority than reading a list of column names deserves.
      - name: Inventory every query the code issues
        run: node scripts/audit/query-inventory.mjs

      - name: Map queries to the routes that can reach them
        run: node scripts/audit/route-reachability.mjs

      - name: Replay every query shape against the database
        run: node scripts/audit/replay-queries.mjs

      - name: Fail on any invalid query reachable from a route
        run: node scripts/audit/gate.mjs

      - name: Check the committed Supabase types still match the database
        run: node scripts/audit/types-drift.mjs

      - name: Check database invariants
        run: node scripts/audit/schema-invariants.mjs

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-audit
          path: .e2e-audit/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      # Single-credential mode: providing E2E_ADMIN_* + E2E_TEST_PASSWORD is enough.
      # global-setup will bootstrap the instructor/member accounts to E2E_TEST_PASSWORD
      # via the admin-users edge function (setE2EPassword action, scoped to e2e-* accounts).
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'e2e-admin@insightscollective.org' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || 'e2e-instructor@insightscollective.org' }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL || 'e2e-member@insightscollective.org' }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_COURSE_ID: ${{ secrets.E2E_TEST_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_INSTRUCTOR_COURSE_ID: ${{ secrets.E2E_INSTRUCTOR_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_ADMIN_COURSE_ID: ${{ secrets.E2E_TEST_ADMIN_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_COURSE_TITLE: ${{ secrets.E2E_TEST_COURSE_TITLE || 'Introduction to Data Science' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://siuqvhscuiycvdrtiqsh.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'siuqvhscuiycvdrtiqsh' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 0.0.0.0 &
          echo $! > .preview.pid
          for i in {1..30}; do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "Preview ready"; break;
            fi
            echo "Waiting for preview ($i)..."; sleep 2;
          done

      - name: Seed E2E fixtures
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -f e2e/fixtures/seed.sql

      - name: Run Playwright suite
        run: npx playwright test --reporter=list,html,json

      - name: Coverage gap report
        if: always()
        run: |
          echo "## E2E Coverage Gap Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e/TEST-PLAN.md ]; then
            echo "### Journeys documented in TEST-PLAN.md" >> $GITHUB_STEP_SUMMARY
            grep -E '^### ' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Explicit coverage gaps (from TEST-PLAN.md)" >> $GITHUB_STEP_SUMMARY
            awk '/^## Coverage gaps/{flag=1;next}/^## /{flag=0}flag' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f test-results.json ] || [ -f playwright-report/results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test outcome summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const p = fs.existsSync('test-results.json') ? 'test-results.json' : 'playwright-report/results.json';
              const r = JSON.parse(fs.readFileSync(p,'utf8'));
              const s = r.stats || {};
              console.log('Passed:', s.expected||0, 'Failed:', s.unexpected||0, 'Skipped:', s.skipped||0, 'Flaky:', s.flaky||0);
              const skipped = [];
              function walk(node){ (node.suites||[]).forEach(walk); (node.specs||[]).forEach(sp=>sp.tests.forEach(t=>t.results.forEach(res=>{ if(res.status==='skipped') skipped.push(sp.title+' — '+(res.error?.message||'no reason')); }))); }
              (r.suites||[]).forEach(walk);
              if (skipped.length) { console.log('\nSkipped (potential coverage gaps):'); skipped.forEach(s=>console.log(' -', s)); }
            " >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/junit.xml
            test-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill $(cat .preview.pid) || true
