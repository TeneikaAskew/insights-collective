name: E2E Playwright Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Regenerate the visual regression baselines on this runner and commit
          them back to the dispatched branch (instead of running the suite).
        type: boolean
        default: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write is only exercised by the opt-in baseline regeneration
    # below, which commits the new PNGs back to the dispatched branch.
    permissions:
      contents: write
    env:
      E2E_BASE_URL: http://localhost:8080
      # Single-credential mode: providing E2E_ADMIN_* + E2E_TEST_PASSWORD is enough.
      # global-setup will bootstrap the instructor/member accounts to E2E_TEST_PASSWORD
      # via the admin-users edge function (setE2EPassword action, scoped to e2e-* accounts).
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'e2e-admin@insightscollective.org' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || 'e2e-instructor@insightscollective.org' }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL || 'e2e-member@insightscollective.org' }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_COURSE_ID: ${{ secrets.E2E_TEST_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_INSTRUCTOR_COURSE_ID: ${{ secrets.E2E_INSTRUCTOR_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_ADMIN_COURSE_ID: ${{ secrets.E2E_TEST_ADMIN_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_COURSE_TITLE: ${{ secrets.E2E_TEST_COURSE_TITLE || 'Introduction to Data Science' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://siuqvhscuiycvdrtiqsh.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'siuqvhscuiycvdrtiqsh' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 0.0.0.0 &
          echo $! > .preview.pid
          for i in {1..30}; do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "Preview ready"; break;
            fi
            echo "Waiting for preview ($i)..."; sleep 2;
          done

      - name: Seed E2E fixtures
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -f e2e/fixtures/seed.sql

      - name: Run Playwright suite
        if: inputs.update_snapshots != true
        run: npx playwright test --reporter=list,html,json

      # Baseline regeneration is opt-in via workflow_dispatch. It has to happen
      # on the runner: the files are *-visual-linux.png, and the member/admin
      # routes only render their real content with a real session — a baseline
      # captured anywhere else just relocates the failure.
      - name: Regenerate visual baselines
        if: inputs.update_snapshots == true
        run: npx playwright test --project=visual --update-snapshots e2e/visual --reporter=list

      # global-setup writes {"cookies":[],"origins":[]} when a role fails to
      # authenticate, and the suite then renders those routes logged-out. Baking
      # a signed-out page into a baseline is worse than leaving the check red, so
      # refuse to commit unless every role actually has a session.
      - name: Verify baselines came from authenticated sessions
        if: inputs.update_snapshots == true
        run: |
          for role in admin instructor member; do
            f=".playwright-sessions/$role.json"
            if [ ! -s "$f" ] || ! grep -q 'supabase.auth.token' "$f"; then
              echo "::error::No $role session — regenerated baselines would capture logged-out pages. Refusing to commit."
              exit 1
            fi
            echo "$role session OK"
          done

      - name: Commit regenerated baselines
        if: inputs.update_snapshots == true
        run: |
          if git diff --quiet -- e2e/visual; then
            echo "Baselines already match this runner — nothing to commit."
            exit 0
          fi
          git diff --stat -- e2e/visual
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual
          git commit -m "Regenerate visual regression baselines on the CI runner"
          git push origin HEAD:${{ github.ref_name }}

      - name: Coverage gap report
        if: always()
        run: |
          echo "## E2E Coverage Gap Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e/TEST-PLAN.md ]; then
            echo "### Journeys documented in TEST-PLAN.md" >> $GITHUB_STEP_SUMMARY
            grep -E '^### ' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Explicit coverage gaps (from TEST-PLAN.md)" >> $GITHUB_STEP_SUMMARY
            awk '/^## Coverage gaps/{flag=1;next}/^## /{flag=0}flag' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f test-results.json ] || [ -f playwright-report/results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test outcome summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Piped through tee, not redirected: this step runs last, so writing
            # the failure list to stdout too is what puts it inside the window
            # the GitHub log API returns. Without it the only record of WHICH
            # tests failed is the JSON reporter dump, which the API truncates
            # away — leaving a red check with no diagnosable cause.
            node -e "
              const fs = require('fs');
              const p = fs.existsSync('test-results.json') ? 'test-results.json' : 'playwright-report/results.json';
              const r = JSON.parse(fs.readFileSync(p,'utf8'));
              const s = r.stats || {};
              console.log('Passed:', s.expected||0, 'Failed:', s.unexpected||0, 'Skipped:', s.skipped||0, 'Flaky:', s.flaky||0);
              const failed = [], flaky = [], skipped = [];
              const firstError = t => {
                for (const res of t.results||[]) {
                  const m = (res.error && res.error.message) || ((res.errors||[])[0]||{}).message;
                  if (m) return m.replace(/\x1b\[[0-9;]*m/g,'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2).join(' | ');
                }
                return 'no error message';
              };
              function walk(node){
                (node.suites||[]).forEach(walk);
                (node.specs||[]).forEach(sp=>sp.tests.forEach(t=>{
                  const where = (sp.file||'?')+' ['+(t.projectName||'?')+'] '+sp.title;
                  if (t.status === 'unexpected') failed.push(where+' — '+firstError(t));
                  else if (t.status === 'flaky') flaky.push(where);
                  t.results.forEach(res=>{ if(res.status==='skipped') skipped.push(sp.title+' — '+(res.error?.message||'no reason')); });
                }));
              }
              (r.suites||[]).forEach(walk);
              if (failed.length) { console.log('\nFailed tests ('+failed.length+'):'); failed.forEach(f=>console.log(' -', f)); }
              if (flaky.length) { console.log('\nFlaky tests ('+flaky.length+'):'); flaky.forEach(f=>console.log(' -', f)); }
              if (skipped.length) { console.log('\nSkipped (potential coverage gaps):'); skipped.forEach(s=>console.log(' -', s)); }
            " 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/junit.xml
            test-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill $(cat .preview.pid) || true
