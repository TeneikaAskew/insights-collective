name: E2E Playwright Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      # Single-credential mode: providing E2E_ADMIN_* + E2E_TEST_PASSWORD is enough.
      # global-setup will bootstrap the instructor/member accounts to E2E_TEST_PASSWORD
      # via the admin-users edge function (setE2EPassword action, scoped to e2e-* accounts).
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'e2e-admin@insightscollective.org' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || 'e2e-instructor@insightscollective.org' }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL || 'e2e-member@insightscollective.org' }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_COURSE_ID: ${{ secrets.E2E_TEST_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_INSTRUCTOR_COURSE_ID: ${{ secrets.E2E_INSTRUCTOR_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_ADMIN_COURSE_ID: ${{ secrets.E2E_TEST_ADMIN_COURSE_ID || '660e8400-e29b-41d4-a716-446655440001' }}
      E2E_TEST_COURSE_TITLE: ${{ secrets.E2E_TEST_COURSE_TITLE || 'Introduction to Data Science' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://siuqvhscuiycvdrtiqsh.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'siuqvhscuiycvdrtiqsh' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 0.0.0.0 &
          echo $! > .preview.pid
          for i in {1..30}; do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "Preview ready"; break;
            fi
            echo "Waiting for preview ($i)..."; sleep 2;
          done

      - name: Seed E2E fixtures
        if: env.SUPABASE_DB_URL != ''
        run: |
          # psql treats an argument that is not a connection URI as a DATABASE
          # NAME and silently falls back to the local unix socket -- which
          # surfaces as "connection to server on socket /var/run/postgresql/
          # .s.PGSQL.5432 failed", easily misread as a network problem when it
          # actually means the secret is not a URI. Say so plainly instead.
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must be a full connection URI beginning with postgresql:// — Supabase dashboard → Project Settings → Database → Connection string → URI. The current value would be treated by psql as a local database name."
              exit 1
              ;;
          esac
          # A scheme alone is not enough: a database password containing URI
          # reserved characters silently corrupts the authority section. A raw
          # "?" starts the query component and a raw "%" opens a percent-escape,
          # so a password such as pa?ss makes the parser stop reading the host at
          # "pa" and treat everything after it as junk -- psql then fails
          # somewhere well downstream of the real mistake. Catch it here.
          # Deliberately no worked example here: an inline connection-string
          # literal, even a fabricated one, trips TruffleHog's Postgres detector
          # and fails the Secret Detection job.
          python3 - <<'PY' || exit 1
          import os, sys
          from urllib.parse import urlsplit
          try:
              parts = urlsplit(os.environ["SUPABASE_DB_URL"])
              port = parts.port
          except ValueError:
              print("::error::SUPABASE_DB_URL does not parse as a URI. If the database password contains reserved characters, percent-encode it: % becomes %25, ? becomes %3F, # becomes %23, / becomes %2F, @ becomes %40, : becomes %3A.")
              sys.exit(1)
          if not parts.hostname or not port:
              print("::error::SUPABASE_DB_URL is missing a host or port. Expected the postgresql:// URI form ending in :5432/postgres, and percent-encode the password if it contains reserved characters.")
              sys.exit(1)
          PY
          # ON_ERROR_STOP so a failed statement (including the seed's own
          # invariant RAISE EXCEPTIONs) fails the step. Without it psql prints
          # the error and still exits 0, and a half-applied seed looks fine
          # while the specs fail later for reasons that make no sense.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f e2e/fixtures/seed.sql

      - name: Run Playwright suite
        run: npx playwright test --reporter=list,html,json

      - name: Coverage gap report
        if: always()
        run: |
          echo "## E2E Coverage Gap Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e/TEST-PLAN.md ]; then
            echo "### Journeys documented in TEST-PLAN.md" >> $GITHUB_STEP_SUMMARY
            grep -E '^### ' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Explicit coverage gaps (from TEST-PLAN.md)" >> $GITHUB_STEP_SUMMARY
            awk '/^## Coverage gaps/{flag=1;next}/^## /{flag=0}flag' e2e/TEST-PLAN.md >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f test-results.json ] || [ -f playwright-report/results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test outcome summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const p = fs.existsSync('test-results.json') ? 'test-results.json' : 'playwright-report/results.json';
              const r = JSON.parse(fs.readFileSync(p,'utf8'));
              const s = r.stats || {};
              console.log('Passed:', s.expected||0, 'Failed:', s.unexpected||0, 'Skipped:', s.skipped||0, 'Flaky:', s.flaky||0);
              const skipped = [];
              function walk(node){ (node.suites||[]).forEach(walk); (node.specs||[]).forEach(sp=>sp.tests.forEach(t=>t.results.forEach(res=>{ if(res.status==='skipped') skipped.push(sp.title+' — '+(res.error?.message||'no reason')); }))); }
              (r.suites||[]).forEach(walk);
              if (skipped.length) { console.log('\nSkipped (potential coverage gaps):'); skipped.forEach(s=>console.log(' -', s)); }
            " >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/junit.xml
            test-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill $(cat .preview.pid) || true
