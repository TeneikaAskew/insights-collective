name: Nightly Full Test Suite

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Testing
    runs-on: ubuntu-latest

    # Only whether a token exists, never the token. The `secrets` context is
    # not readable from a step-level `if` but `env` is, and a job-level env is
    # visible to every step in the job — including `npm install`, which runs
    # dependency install scripts, and the test run itself. The secret goes
    # straight into the one step that needs it instead.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Run all tests with coverage
      run: npm run test:coverage -- --run
    
    - name: Generate detailed coverage report
      run: |
        echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat coverage/coverage-summary.json | jq >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Performance benchmarks
      run: |
        echo "Running performance benchmarks..."
        time npm run test -- --run
    
    # Every nightly from 2026-07-26 to 2026-08-24 failed here, and only here:
    # all 164 test files and 1,544 tests passed, then the upload returned
    # `429 - Rate limit reached. Please upload with the Codecov repository
    # upload token`, and fail_ci_if_error turned that into a red build.
    #
    # No token was ever passed ("No token specified or token is empty" in every
    # log), so these were anonymous uploads, which Codecov rate-limits per IP —
    # and the IPs are shared GitHub Actions runners, permanently over the limit.
    # So the step is skipped unless a token is configured, and a coverage host
    # being unreachable no longer fails a test suite that passed. test.yml has
    # always used fail_ci_if_error: false for the identical upload, which is why
    # only the nightly went red.
    - name: Upload comprehensive coverage
      if: env.HAS_CODECOV_TOKEN == 'true'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage-final.json
        flags: nightly
        fail_ci_if_error: false

  dependency-check:
    name: Dependency Updates Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Check for outdated dependencies
      run: npm outdated || true
    
    - name: Install latest compatible versions
      run: npm update --legacy-peer-deps
    
    - name: Run tests with updated dependencies
      run: npm run test -- --run
    
    - name: Create issue if dependencies fail
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Nightly: Dependency update tests failed',
            body: 'The nightly dependency update check has failed. Please review the workflow logs.',
            labels: ['dependencies', 'automated']
          })

  test-metrics:
    name: Test Execution Metrics
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Track test execution time
      run: |
        START_TIME=$(date +%s)
        npm run test -- --run
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "Test execution time: ${DURATION}s" >> $GITHUB_STEP_SUMMARY
        
        if [ $DURATION -gt 300 ]; then
          echo "::warning::Test execution is taking longer than 5 minutes (${DURATION}s)"
        fi
