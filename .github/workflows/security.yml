name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Mondays

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Run npm audit
      run: |
        # Informational, non-blocking human-readable summary.
        npm audit --audit-level=moderate || true
        # npm audit exits non-zero both when advisories are found AND when the audit itself fails (registry,
        # network, lockfile); in the second case it prints {"error": {...}}. The exit statuses are kept and the
        # reports are judged by scripts/ci/check-npm-audit.mjs, which fails closed on anything that is not a
        # well-formed report. The previous `jq '.high // 0'` read an error object, or an empty file, as zero.
        set +e
        npm audit --json > audit-results.json; echo "$?" > audit-status.txt
        npm audit --omit=dev --json > audit-results-prod.json; echo "$?" > audit-status-prod.txt
        set -e
        echo "npm audit exit status: full=$(cat audit-status.txt) prod=$(cat audit-status-prod.txt)"

    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-results
        path: |
          audit-results.json
          audit-results-prod.json
          audit-status.txt
          audit-status-prod.txt

    - name: Check the full report is a usable audit (not an error object)
      # Full audit (incl. devDependencies) is visibility only, but it must still be a real report: an error
      # here means the uploaded artifact proves nothing.
      env:
        AUDIT_GATE_MODE: visibility
      run: node scripts/ci/check-npm-audit.mjs audit-results.json "$(cat audit-status.txt)" || [ $? -eq 1 ]

    - name: Check for high severity vulnerabilities
      run: |
        # Gate on PRODUCTION dependencies: dev-tooling advisories (currently
        # the eslint/minimatch chain, pending an eslint@10 migration) are
        # visible in the artifact but must not mask real runtime exposure.
        # Exit 1 = high/critical found, exit 2 = report unusable; both fail the job.
        node scripts/ci/check-npm-audit.mjs audit-results-prod.json "$(cat audit-status-prod.txt)"

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    # The exclusion in codeql-config.yml applies repo-wide, because CodeQL filters
    # by rule and not by path. It is only defensible while the write sites it covers
    # stay the ones that were actually reviewed, so assert that before the scan
    # rather than trusting it. Runs first: a failure here should read as "the
    # exclusion no longer fits", not as a CodeQL result.
    - name: Filesystem writes stay in reviewed locations
      run: |
        # Allowlist, not a directory list. An earlier version of this step passed
        # `src supabase/functions` as grep operands, which meant it only ever looked
        # at two directories and reported the invariant held while e2e/ was writing
        # failed network responses to an audit log. Enumerate the whole tracked tree
        # and subtract what has been reviewed, so a new write site ANYWHERE fails.
        #
        #   scripts/                  the crawler's parsed-record cache — the flow the
        #                             js/http-to-file-access exclusion exists for
        #   console-errors.fixture.ts opt-in E2E audit log (E2E_AUDIT_CONSOLE=1); it
        #                             records failed network responses, so it is a
        #                             network-to-disk flow too
        #   src/test/ci/checkLocalTarget.test.ts
        #                             vitest fixture: fixed synthetic strings written
        #                             into a fresh mkdtemp directory; no network data
        #                             (one exact file, approved 2026-11-01)
        #   e2e/quiz-lifecycle/session.fixture.ts
        #                             explicit local-DB-to-disk evidence writer for the isolated learner-quiz
        #                             lane. Sources: a fixed read-only SQL file (scripts/local-stack/quiz-
        #                             lifecycle/ledger.sql, SESSION READ ONLY) scoped to one synthetic learner
        #                             and quiz on the run-owned loopback stack, plus the fixed output of
        #                             revoke-access.sh and a per-test egress violation count. Rows are kept
        #                             only by a /^[AWPEGC]\t/ PREFIX filter; that is not a full grammar, and
        #                             W rows carry DB-derived answer JSON verbatim. Output root is
        #                             QLC_EVIDENCE_DIR (runner temp) under fixed names (ledger/<label>.tsv,
        #                             checks/revoke-access.txt, egress.txt). Not network-response sanitization
        #   src/test/ci/caseDiagnostics.test.ts, src/test/ci/checkLearnerAuthGate.test.ts,
        #   src/test/ci/checkT09StageContract.test.ts, src/test/ci/gbJobHolds.test.ts
        #                             vitest fixtures: fixed synthetic strings (fake psql/node/rm shims, fake
        #                             fetch preload, 'fake-key', placeholder files) into fresh mkdtemp dirs; no
        #                             network data
        #   (the five entries above approved 2026-11-02: user 12:08:50Z, relayed by T 13:01:47Z; proposal c1059c5)
        #   src/test/ci/checkGradebookJourneyJob.test.ts
        #                             vitest fixture: one stage-evidence negative writes fixed synthetic receipts
        #                             ('ok', or empty) and a placeholder tested-ids.txt into a fresh mkdtemp dir,
        #                             runs the real stack-checks.sh stage-evidence on it, and removes the dir; no
        #                             network data (one exact file; approved 2026-11-02: user 19:14:49Z,
        #                             relayed by T 19:15:29Z; proposal r1.1, diff 926fcf0e)
        #   e2e/roster-reports/actors.mjs
        #                             roster acceptance telemetry sink (appendTelemetry, the file's only write):
        #                             one JSON line {"rpc","actor","status"} whose values are own keys of fixed
        #                             null-prototype enums (no body, token, header, URL or raw id), appended through
        #                             one O_WRONLY|O_APPEND|O_NOFOLLOW|O_NONBLOCK fd (no O_CREAT) to a run.sh
        #                             pre-created 0600 policy.jsonl under the private 0700 rr-run.XXXXXXXXXX/session
        #                             dir, fstat-checked on the same fd, bounded; used for database reconciliation
        #                             (one exact file; approved 2026-11-03: user 02:53:20Z, relayed by T 02:55:03Z;
        #                             scope packet pr134/owner-review-packets/roster-actors-writer-scope/)
        #   e2e/stubbed/sandboxed-test.ts
        #                             sealed stubbed video lane fixture (local, unrun lane): exactly two
        #                             writeFileSync calls per Playwright worker, flag 'wx' (exclusive, never
        #                             overwrite) and mode 0600, at <LE_EGRESS_DIR>/<stem>.start (fixed text
        #                             EGRESS_WORKER_START) and <stem>.end (closed grammar: a counter line and at
        #                             most 16 REFUSED lines). The stem is egressStem(): worker and parallel index,
        #                             pid and 16 random hex digits; nothing from the page reaches the path.
        #                             LE_EGRESS_DIR is the lane's private output dir, created empty with mode 0700
        #                             by video-entry.mjs; that confinement depends on the composed lane carrier.
        #                             Browser-derived content is limited to: event-derived counts (refused,
        #                             tests) and the closed flag; per REFUSED line, the category (method or
        #                             websocket), a constrained method token (upper-case A-Z, 1-12 letters, else
        #                             '-'), and the origin reduced to scheme://host[:port] or <opaque>
        #                             (egress-records.mjs refusedLine/refusalOrigin); origins can be private. Records
        #                             are detection evidence, not tamper-proof; observation starts after context
        #                             construction, and no event after the ledger is sealed is assumed, not
        #                             proven. No network response bodies are written.
        #                             (one exact file; REVIEW CANDIDATE, recomposed on main c91c8c19 from source
        #                             66c6e365; not yet approved)
        #
        # mkdirSync is deliberately not matched: creating a directory puts no data on
        # disk, and matching it would only force e2e/global-setup.ts onto this list.
        ALLOWED='^(scripts/|e2e/fixtures/console-errors\.fixture\.ts$|e2e/quiz-lifecycle/session\.fixture\.ts$|e2e/roster-reports/actors\.mjs$|e2e/stubbed/sandboxed-test\.ts$|src/test/ci/(checkLocalTarget|caseDiagnostics|checkLearnerAuthGate|checkT09StageContract|gbJobHolds|checkGradebookJourneyJob)\.test\.ts$)'

        hits=$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
          | grep -vE "$ALLOWED" \
          | xargs -r grep -nE 'writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|Deno\.write' \
          || true)

        if [ -n "$hits" ]; then
          echo "$hits"
          echo "::error::Filesystem write found outside the reviewed locations. The"
          echo "::error::js/http-to-file-access exclusion in .github/codeql/codeql-config.yml"
          echo "::error::suppresses that query repo-wide, so a new write site is covered by"
          echo "::error::it without anyone having weighed the two together."
          echo "::error::Review the code above, then either move it under scripts/ or add it"
          echo "::error::to ALLOWED here and to the note in the CodeQL config."
          exit 1
        fi
        echo "no filesystem writes outside the reviewed locations — exclusion scope holds"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript
        # Query set moved into the config file so it sits beside the one exclusion
        # it is filtered by. Passing `queries:` here as well would union with it.
        config-file: ./.github/codeql/codeql-config.yml
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@v3
      with:
        output: sarif-results

    # CodeQL reports its findings as check-run *annotations*, which are not in
    # the check output, the job log, or as review comments — so a red CodeQL
    # check is undiagnosable from anything the API returns, and the only way to
    # see what it found is the Security tab in a browser. That cost several
    # cycles on PR #30 of knowing only a count.
    #
    # Same reasoning as the E2E job teeing its failure list to stdout: whatever
    # explains a red check has to land somewhere the log API returns.
    - name: Summarise CodeQL findings
      if: always()
      run: |
        shopt -s nullglob
        files=(sarif-results/*.sarif)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no SARIF produced — analysis did not complete"
          exit 0
        fi
        for f in "${files[@]}"; do
          echo "## $(basename "$f")" >> $GITHUB_STEP_SUMMARY
          node -e "
            const sarif = JSON.parse(require('fs').readFileSync('$f','utf8'));
            for (const run of sarif.runs || []) {
              // CodeQL puts query metadata in tool.extensions[].rules (the
              // codeql/javascript-queries pack), NOT tool.driver.rules, which
              // is usually empty. Reading only the driver found no rules at
              // all, so every finding fell through to the 'note' default and
              // the security recap printed 0 — while the check itself was
              // reporting 2 high and 17 medium.
              const rules = new Map();
              for (const comp of [run.tool?.driver, ...(run.tool?.extensions || [])]) {
                for (const r of comp?.rules || []) rules.set(r.id, r);
              }
              const rows = (run.results || []).map(res => {
                const rule = rules.get(res.ruleId) || {};
                // Some results carry the score on the result rather than the rule.
                const sev = rule.properties?.['security-severity']
                  ?? res.properties?.['security-severity'];
                const loc = res.locations?.[0]?.physicalLocation || {};
                return {
                  sev: sev ? Number(sev) : null,
                  level: rule.defaultConfiguration?.level || res.level || 'note',
                  id: res.ruleId,
                  file: loc.artifactLocation?.uri || '?',
                  line: loc.region?.startLine ?? '?',
                  msg: (res.message?.text || '').split('\n')[0].slice(0, 160),
                };
              });
              // Ascending, so the highest-severity findings are the LAST thing
              // printed. The log API only ever returns a window from the end of
              // the job log, so anything worth reading has to finish there —
              // sorting highs first buries them exactly where the window cannot
              // reach, which is how the first version of this step still left
              // the 2 high alerts unreadable.
              rows.sort((a, b) => (a.sev ?? -1) - (b.sev ?? -1));
              console.log(rows.length + ' result(s), least severe first');
              for (const r of rows) {
                const band = r.sev === null ? r.level
                  : r.sev >= 9 ? 'critical' : r.sev >= 7 ? 'high'
                  : r.sev >= 4 ? 'medium' : 'low';
                console.log(\`  \${band.padEnd(8)} \${r.id}\n      \${r.file}:\${r.line}\n      \${r.msg}\`);
              }
              const scored = rows.filter(r => r.sev !== null && r.sev >= 4);
              console.log('\n=== security findings (' + scored.length + ') ===');
              if (rules.size === 0) {
                // A zero here would otherwise read as a clean scan when it
                // actually means no rule metadata could be resolved — the
                // difference between passing and a broken reader. Double
                // quotes are deliberately absent: this whole script is a
                // double-quoted bash string, and one would end it.
                console.log('  WARNING: no rule metadata resolved from this SARIF;');
                console.log('  severities above are defaults, not real values.');
              }
              for (const r of scored) {
                console.log(\`  \${(r.sev >= 9 ? 'critical' : r.sev >= 7 ? 'high' : 'medium').padEnd(8)} \${r.id}  \${r.file}:\${r.line}\`);
              }
            }
          " 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        done

    - name: Upload CodeQL SARIF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif
        path: sarif-results/*.sarif
        if-no-files-found: ignore
        retention-days: 14

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Check licenses
      run: |
        npx license-checker --summary
        npx license-checker --json > licenses.json
    
    - name: Verify license compatibility
      run: |
        # Check for GPL licenses that might conflict
        if grep -q "GPL" licenses.json; then
          echo "::warning::GPL licensed dependencies detected. Review for compatibility."
        fi

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Official TruffleHog action equality guard (wrapper mirrors scripts/ci/vendor/trufflehog-action.yml)
      run: node scripts/ci/check-trufflehog-action.mjs
    - name: TruffleHog Secret Scan (gated; exact approved exceptions only)
      env:
        # Range rules unchanged: the PR range on pull_request, the pushed range on push (an all-zero `before` means
        # no base), and no range on schedule/dispatch (full history; fetch-depth: 0 above). BASE == HEAD is refused
        # exactly as the official action refuses it (scripts/ci/vendor/trufflehog-action.yml).
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || '' }}
        HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || '' }}
      # The wrapper keeps raw scanner output in a private 0700 dir under RUNNER_TEMP, gates it, prints counts and
      # identity digests only, and removes the dir on every exit path. Nothing is uploaded.
      run: bash scripts/ci/trufflehog-scan.sh
