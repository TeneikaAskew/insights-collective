name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Mondays

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Run npm audit
      run: |
        npm audit --audit-level=moderate || true
        # Full audit (incl. devDependencies) kept as the uploaded artifact for
        # visibility; the blocking gate below scopes to production deps.
        npm audit --json > audit-results.json || true
        npm audit --omit=dev --json > audit-results-prod.json || true
    
    - name: Upload audit results
      uses: actions/upload-artifact@v4
      with:
        name: audit-results
        path: audit-results.json
    
    - name: Check for high severity vulnerabilities
      run: |
        # Gate on PRODUCTION dependencies: dev-tooling advisories (currently
        # the eslint/minimatch chain, pending an eslint@10 migration) are
        # visible in the artifact but must not mask real runtime exposure.
        HIGH_VULNS=$(cat audit-results-prod.json | jq '.metadata.vulnerabilities.high // 0')
        CRITICAL_VULNS=$(cat audit-results-prod.json | jq '.metadata.vulnerabilities.critical // 0')
        
        if [ "$HIGH_VULNS" -gt "0" ] || [ "$CRITICAL_VULNS" -gt "0" ]; then
          echo "::error::Found $CRITICAL_VULNS critical and $HIGH_VULNS high severity vulnerabilities"
          exit 1
        fi

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript
        queries: security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@v3
      with:
        output: sarif-results

    # CodeQL reports its findings as check-run *annotations*, which are not in
    # the check output, the job log, or as review comments — so a red CodeQL
    # check is undiagnosable from anything the API returns, and the only way to
    # see what it found is the Security tab in a browser. That cost several
    # cycles on PR #30 of knowing only a count.
    #
    # Same reasoning as the E2E job teeing its failure list to stdout: whatever
    # explains a red check has to land somewhere the log API returns.
    - name: Summarise CodeQL findings
      if: always()
      run: |
        shopt -s nullglob
        files=(sarif-results/*.sarif)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no SARIF produced — analysis did not complete"
          exit 0
        fi
        for f in "${files[@]}"; do
          echo "## $(basename "$f")" >> $GITHUB_STEP_SUMMARY
          node -e "
            const sarif = JSON.parse(require('fs').readFileSync('$f','utf8'));
            for (const run of sarif.runs || []) {
              // CodeQL puts query metadata in tool.extensions[].rules (the
              // codeql/javascript-queries pack), NOT tool.driver.rules, which
              // is usually empty. Reading only the driver found no rules at
              // all, so every finding fell through to the 'note' default and
              // the security recap printed 0 — while the check itself was
              // reporting 2 high and 17 medium.
              const rules = new Map();
              for (const comp of [run.tool?.driver, ...(run.tool?.extensions || [])]) {
                for (const r of comp?.rules || []) rules.set(r.id, r);
              }
              const rows = (run.results || []).map(res => {
                const rule = rules.get(res.ruleId) || {};
                // Some results carry the score on the result rather than the rule.
                const sev = rule.properties?.['security-severity']
                  ?? res.properties?.['security-severity'];
                const loc = res.locations?.[0]?.physicalLocation || {};
                return {
                  sev: sev ? Number(sev) : null,
                  level: rule.defaultConfiguration?.level || res.level || 'note',
                  id: res.ruleId,
                  file: loc.artifactLocation?.uri || '?',
                  line: loc.region?.startLine ?? '?',
                  msg: (res.message?.text || '').split('\n')[0].slice(0, 160),
                };
              });
              // Ascending, so the highest-severity findings are the LAST thing
              // printed. The log API only ever returns a window from the end of
              // the job log, so anything worth reading has to finish there —
              // sorting highs first buries them exactly where the window cannot
              // reach, which is how the first version of this step still left
              // the 2 high alerts unreadable.
              rows.sort((a, b) => (a.sev ?? -1) - (b.sev ?? -1));
              console.log(rows.length + ' result(s), least severe first');
              for (const r of rows) {
                const band = r.sev === null ? r.level
                  : r.sev >= 9 ? 'critical' : r.sev >= 7 ? 'high'
                  : r.sev >= 4 ? 'medium' : 'low';
                console.log(\`  \${band.padEnd(8)} \${r.id}\n      \${r.file}:\${r.line}\n      \${r.msg}\`);
              }
              const scored = rows.filter(r => r.sev !== null && r.sev >= 4);
              console.log('\n=== security findings (' + scored.length + ') ===');
              if (rules.size === 0) {
                // A zero here would otherwise read as a clean scan when it
                // actually means no rule metadata could be resolved — the
                // difference between passing and a broken reader. Double
                // quotes are deliberately absent: this whole script is a
                // double-quoted bash string, and one would end it.
                console.log('  WARNING: no rule metadata resolved from this SARIF;');
                console.log('  severities above are defaults, not real values.');
              }
              for (const r of scored) {
                console.log(\`  \${(r.sev >= 9 ? 'critical' : r.sev >= 7 ? 'high' : 'medium').padEnd(8)} \${r.id}  \${r.file}:\${r.line}\`);
              }
            }
          " 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        done

    - name: Upload CodeQL SARIF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif
        path: sarif-results/*.sarif
        if-no-files-found: ignore
        retention-days: 14

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Check licenses
      run: |
        npx license-checker --summary
        npx license-checker --json > licenses.json
    
    - name: Verify license compatibility
      run: |
        # Check for GPL licenses that might conflict
        if grep -q "GPL" licenses.json; then
          echo "::warning::GPL licensed dependencies detected. Review for compatibility."
        fi

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        # base/head must name two DIFFERENT commits or TruffleHog aborts with
        # "BASE and HEAD commits are the same. TruffleHog won't scan anything."
        # `base: default_branch` + `head: HEAD` collide on every push to main,
        # which is what this job was doing. Diff the range the event actually
        # describes instead: the pushed range on push, the PR range on
        # pull_request. On the weekly schedule there is no range, so both stay
        # empty and TruffleHog scans the full history (fetch-depth: 0 above).
        #
        # The first push to a new branch (develop is a push target) reports
        # `before` as the all-zero SHA. That is nonempty, so the action would
        # hand it to --since-commit and git would fail to resolve it; treat it
        # as "no range" and fall through to a full scan.
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || '' }}
        head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || '' }}
