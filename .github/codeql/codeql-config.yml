# ABOUTME: CodeQL scan configuration. Exists to carry one deliberate query
# ABOUTME: exclusion, documented below, without weakening the rest of the scan.
name: "insights-collective CodeQL config"

# Unchanged from what the workflow used to pass inline. Declared here instead so
# the query set and the exclusion below live in one place.
queries:
  - uses: security-and-quality

query-filters:
  # js/http-to-file-access — "Network data written to file".
  #
  # Motivated by scripts/fetch-coursera-courses.mjs, whose entire purpose is to
  # fetch Coursera course pages and cache the parsed result on disk so a monthly
  # crawl over 7,000+ pages can resume instead of restarting. The flow the query
  # describes is the feature; it cannot be refactored away without deleting the
  # cache.
  #
  # What the query is really warning about is untrusted bytes reaching the
  # filesystem unchecked. Both halves of that are handled at the mechanism, which
  # is why this is an exclusion and not a dismissal-by-fatigue:
  #
  #   * Path — the filename is a SHA-1 of the URL (cachePathFor), so no part of a
  #     fetched response reaches the path. Traversal is not expressible.
  #   * Content — cacheableRecord() whitelists an explicit field list and coerces
  #     every one to a primitive before writing. An unexpected field on a changed
  #     Coursera page cannot reach disk at all.
  #
  # CodeQL filters by rule, not by path, so this necessarily applies repo-wide —
  # including to the OTHER network-to-disk write in the tree, the opt-in E2E audit
  # log in e2e/fixtures/console-errors.fixture.ts, which appends failed network
  # responses to .e2e-audit/ when E2E_AUDIT_CONSOLE=1. That one is test-only, off
  # by default, and writes to a fixed path, but it is covered by this exclusion and
  # should be named rather than discovered later.
  #
  # The write-location gate below also allows exact fixture-only test files that
  # write fixed synthetic strings into fresh mkdtemp directories and read no network
  # data: src/test/ci/checkLocalTarget.test.ts, caseDiagnostics.test.ts,
  # checkLearnerAuthGate.test.ts, checkT09StageContract.test.ts, gbJobHolds.test.ts and
  # checkGradebookJourneyJob.test.ts (six files). They are not flows this exclusion is about; they are listed only
  # because the gate matches every write call.
  #
  # It also allows one explicit local-DB-to-disk writer,
  # e2e/quiz-lifecycle/session.fixture.ts: isolated-run evidence from a fixed
  # read-only SQL ledger scoped to one synthetic learner and quiz on the run-owned
  # loopback stack, kept by a /^[AWPEGC]\t/ prefix filter (not a full grammar; answer
  # JSON stays DB-derived), plus fixed script output and counts, under
  # QLC_EVIDENCE_DIR. It is not network-response sanitization.
  #
  # It also allows one exact local test writer, e2e/stubbed/sandboxed-test.ts (sealed
  # stubbed video lane, review candidate): two exclusive ('wx') mode-0600 records per
  # Playwright worker under the lane's private LE_EGRESS_DIR, at fixed-grammar names
  # with no page-derived path part. Browser-derived content is limited to event-derived
  # counts (refused, tests) and a closed flag, and per refused non-GET/HEAD request or
  # WebSocket: its category, a constrained method token (A-Z, 1-12 letters, else '-')
  # and its origin reduced to scheme://host[:port] or <opaque>, which can be private;
  # no response body is written. The records are detection
  # evidence, not tamper-proof, and their confinement depends on the composed lane
  # carrier. It is listed because the gate matches every write call, not because this
  # exclusion was widened for it.
  #
  # None of these adds a query suppression; the query filter below is unchanged and
  # remains reviewed debt.
  #
  # The reviewed network-to-disk writes are those two: the crawler cache under
  # scripts/ and the opt-in console-errors audit log. The "Filesystem writes stay in
  # reviewed locations" step in security.yml keeps the set closed: it enumerates
  # every tracked source file, subtracts its ALLOWED list (scripts/, the
  # console-errors fixture, the six fixture-only test files, the local-DB
  # evidence writer and the sealed-video record writer above, and the roster
  # telemetry sink e2e/roster-reports/actors.mjs, which writes only fixed enum
  # values), and fails
  # the build on any other write call. That gate limits where writes may appear; it
  # does not make this repo-wide exclusion safe, which remains reviewed debt.
  # Remove that step and this exclusion stops being narrow.
  - exclude:
      id: js/http-to-file-access
